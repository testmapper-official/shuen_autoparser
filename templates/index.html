<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='logo.ico') }}">
    <title>WC3 Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="topbar">
            <div class="title" id="appTitle" data-i18n="APP_TITLE">WC3 Manager</div>
            <div class="topbar-right">
                <div class="last-check-widget" id="lastCheckWidget" style="display: none;">
                    <span id="lastCheckTime"></span>
                </div>
                <div class="conn-status" id="connStatus">
                    <span class="dot offline" id="connDot"></span>
                    <span id="connText" data-i18n="STATUS_OFFLINE">Offline</span>
                </div>
                <button id="hookBtn" class="btn btn-hook">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                    <span id="hookBtnText" data-i18n="HOOK_BTN_OFF">Hook: OFF</span>
                </button>
                <button id="langBtn" class="btn btn-icon" title="Language">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                </button>
                <button id="settingsBtn" class="btn btn-icon" title="Settings">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <button id="profileBtn" class="btn btn-icon" title="Profile">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
                <button id="launchBtn" class="btn btn-primary" data-i18n="LAUNCH_BTN" disabled>Launch</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="tabs">
                    <button id="tabBackups" class="tab active" data-i18n="TAB_BACKUPS">Backups</button>
                    <button id="tabLogs" class="tab" data-i18n="TAB_LOGS">Logs</button>
                </div>
                <div class="explorer-header" id="explorerHeader">Backups</div>
                <div class="file-list" id="backupList"></div>
            </aside>

            <main class="workspace">
                <div class="path-display">
                    <button id="changePathBtn" class="path-btn">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    </button>
                    <span id="pathText" class="path-text" data-i18n="PATH_NOT_SET">Path not set</span>
                </div>
                
                <div class="empty-state" id="emptyState" data-i18n="EMPTY_STATE">
                    Select a backup to view options
                </div>

                <div class="action-card" id="actionCard" style="display: none;">
                    <div class="card-header">
                        <div class="card-title-group">
                            <h3 id="selectedBackupName"></h3>
                            <p id="selectedBackupDate"></p>
                        </div>
                        <div class="action-buttons" id="backupActions">
                            <button id="renameBackupBtn" class="btn btn-secondary" data-i18n="RENAME_BACKUP">Rename</button>
                            <button id="deleteBackupBtn" class="btn btn-danger" data-i18n="DELETE_BACKUP">Delete</button>
                            <button id="restoreBackupBtn" class="btn btn-success" data-i18n="RESTORE_BACKUP">Restore</button>
                        </div>
                    </div>
                    <div class="card-content" id="cardContent"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="langModal" style="display: none;">
        <div class="modal">
            <h2 data-i18n="LANG_MODAL_TITLE">Select Language</h2>
            <div class="lang-list" id="langList"></div>
            <button class="btn btn-secondary" onclick="closeModal('langModal')" data-i18n="CANCEL_BTN">Cancel</button>
        </div>
    </div>

    <div class="modal-overlay" id="renameModal" style="display: none;">
        <div class="modal">
            <h2 data-i18n="RENAME_MODAL_TITLE">Rename Backup</h2>
            <label data-i18n="RENAME_MODAL_LABEL">New filename:</label>
            <input type="text" id="inputRename" class="text-input">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('renameModal')" data-i18n="CANCEL_BTN">Cancel</button>
                <button class="btn btn-primary" onclick="renameBackup()" data-i18n="SAVE_BTN">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="intervalModal" style="display: none;">
        <div class="modal">
            <h2 data-i18n="INTERVAL_TITLE">Auto-parse Settings</h2>
            <label data-i18n="INTERVAL_LABEL">Check interval (minutes)</label>
            <div class="slider-container">
                <input type="range" id="intervalSlider" min="1" max="60" value="5">
                <span id="intervalValue">5</span>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('intervalModal')" data-i18n="CANCEL_BTN">Cancel</button>
                <button class="btn btn-primary" onclick="saveInterval()" data-i18n="SAVE_BTN">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="profileModal" style="display: none;">
        <div class="modal">
            <button class="modal-close" id="profileModalClose">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <h2 id="profileModalTitle">Profile Setup</h2>
            <label data-i18n="PROFILE_NAME_LABEL">Profile name</label>
            <input type="text" id="inputProfile" class="text-input" data-i18n-placeholder="PLACEHOLDER_PROFILE">
            <label data-i18n="PROFILE_PASSWORD_LABEL">Password</label>
            <input type="password" id="inputPassword" class="text-input" data-i18n-placeholder="PLACEHOLDER_PASSWORD">
            <div class="modal-actions">
                <button class="btn btn-primary" id="saveProfileBtn" onclick="saveProfile()" data-i18n="SAVE_BTN">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="pathModal" style="display: none;">
        <div class="modal">
            <h2 data-i18n="STEP2_MODAL_TITLE">Step 2: Warcraft III Path</h2>
            <p data-i18n="STEP2_MODAL_DESC">Specify the path to .bat file.</p>
            <div class="modal-actions">
                <button class="btn btn-primary" id="settingsPathBtn" data-i18n="SELECT_PATH_BTN">Select .bat file</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal" style="display: none;">
        <div class="modal">
            <h2 id="confirmTitle" data-i18n="CONFIRM_TITLE">Confirmation</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('confirmModal')" data-i18n="CANCEL_BTN">Cancel</button>
                <button class="btn btn-danger" id="confirmActionBtn" data-i18n="CONFIRM_BTN">Confirm</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="alertModal" style="display: none;">
        <div class="modal">
            <h2 id="alertTitle" data-i18n="ERROR_TITLE">Error</h2>
            <p id="alertText"></p>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeModal('alertModal')" data-i18n="CLOSE_BTN">OK</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
